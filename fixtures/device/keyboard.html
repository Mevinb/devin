<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyboard Obstruction Defect Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: white; font-family: sans-serif; min-height: 100vh; }
    .bottom-fixed-chat {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 12px;
      background: #1e293b;
      color: white;
      border: 1px solid #475569;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div style="padding: 20px;">
    <h1>Chat Room</h1>
    <p>Message thread content here...</p>
  </div>
  <div class="bottom-fixed-chat">
    <input type="text" id="chatInput" placeholder="Type a message..." />
    <button style="padding: 12px 20px; background: #6366f1; color: white; border: none; border-radius: 6px;">Send</button>
  </div>
</body>
</html>
