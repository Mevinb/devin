<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Focus Ring Defect Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: white; font-family: sans-serif; padding: 40px; }
    /* Invisible focus indicator defect */
    button {
      padding: 14px 28px;
      margin: 10px;
      background: #1e293b;
      color: white;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 16px;
      outline: none !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>
  <h1>TV Remote D-Pad Navigation</h1>
  <p style="color: #94a3b8; margin-bottom: 20px;">These buttons have outline: none and no focus indicators:</p>
  <div>
    <button id="btnPlay">▶ Play Movie</button>
    <button id="btnSettings">⚙ Settings</button>
  </div>
</body>
</html>
