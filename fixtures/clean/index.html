<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clean Responsive Baseline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      background: #0f172a;
      color: #f8fafc;
      padding: 24px;
      overflow-x: hidden;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 32px;
    }
    h1 {
      font-size: clamp(24px, 5vw, 36px);
      margin-bottom: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .card h2 {
      font-size: 20px;
      margin-bottom: 12px;
    }
    .btn {
      display: inline-block;
      min-width: 120px;
      min-height: 44px;
      background: #6366f1;
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Clean Responsive Website</h1>
      <p>This page follows fluid responsive guidelines and has no visual defects.</p>
    </header>
    <div class="grid">
      <div class="card">
        <h2>Card One</h2>
        <p>Fully fluid content wrapping correctly across all screen sizes.</p>
      </div>
      <div class="card">
        <h2>Card Two</h2>
        <p>Ample touch targets and clear spacing.</p>
      </div>
    </div>
    <button class="btn">Explore Features</button>
  </div>
</body>
</html>
