<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 49, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(99, 102, 241, 0.4);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --critical: #ef4444;
      --critical-bg: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --pass: #10b981;
      --pass-bg: rgba(16, 185, 129, 0.15);
      --info: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(239, 68, 68, 0.06) 0%, transparent 45%);
    }

    /* Container */
    .container { max-width: 1440px; margin: 0 auto; padding: 32px 24px; }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .logo-group { display: flex; align-items: center; gap: 14px; }
    .logo-badge {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 20px; color: white;
      box-shadow: 0 8px 24px var(--accent-glow);
    }
    .brand-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .brand-subtitle { font-size: 13px; color: var(--text-muted); }
    .target-url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      max-width: 450px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Summary Grid */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .summary-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .summary-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
    }
    .card-total::before { background: var(--accent); }
    .card-critical::before { background: var(--critical); }
    .card-warning::before { background: var(--warning); }
    .card-passed::before { background: var(--pass); }

    .summary-label { font-size: 13px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    .summary-value { font-size: 32px; font-weight: 800; margin-top: 6px; letter-spacing: -1px; }

    /* Filters Bar */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 18px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .filter-tabs { display: flex; gap: 8px; }
    .filter-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-tab:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
    .filter-tab.active {
      color: white;
      background: var(--accent);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* Matrix Cards Grid */
    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .render-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .render-card:hover {
      transform: translateY(-3px);
      border-color: var(--card-hover-border);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .render-thumb-wrapper {
      height: 200px;
      background: #04070e;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .render-thumb {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .thumb-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-pass { background: var(--pass-bg); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
    .badge-fail { background: var(--critical-bg); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }

    .render-info { padding: 18px; }
    .render-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .render-specs { font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; margin-bottom: 12px; }
    .render-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .pill-critical { background: var(--critical-bg); color: #fca5a5; }
    .pill-warning { background: var(--warning-bg); color: #fcd34d; }
    .pill-pass { background: var(--pass-bg); color: #6ee7b7; }

    /* Modal / Inspector */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 14, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      padding: 24px;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-container {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 18px;
      width: 95vw;
      height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .modal-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body {
      display: grid;
      grid-template-columns: 1fr 420px;
      flex: 1;
      overflow: hidden;
    }
    .viewer-pane {
      background: #020617;
      overflow: auto;
      padding: 24px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .viewer-image {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .sidebar-pane {
      border-left: 1px solid var(--card-border);
      overflow-y: auto;
      padding: 20px;
      background: rgba(15, 23, 42, 0.95);
    }
    .finding-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .finding-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .finding-num {
      width: 22px; height: 22px; border-radius: 6px; background: var(--accent);
      color: white; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    }
    .finding-desc { font-size: 13px; line-height: 1.5; margin-bottom: 10px; color: #e2e8f0; }
    .selector-box {
      background: #090d16;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #93c5fd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .selector-box:hover { border-color: var(--accent); }
    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
    }
    .close-btn:hover { color: white; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-group">
        <div class="logo-badge">PS</div>
        <div>
          <h1 class="brand-title">PixelSentinel</h1>
          <p class="brand-subtitle">Responsive Visual Defect Analysis Report</p>
        </div>
      </div>
      <div class="target-url" title="/home/mevlec/Data/devinv2/fixtures/clean">🎯 /home/mevlec/Data/devinv2/fixtures/clean</div>
    </header>

    <!-- Metrics -->
    <div class="summary-grid">
      <div class="summary-card card-total">
        <div class="summary-label">Viewports Tested</div>
        <div class="summary-value">1</div>
      </div>
      <div class="summary-card card-critical">
        <div class="summary-label">Critical Defects</div>
        <div class="summary-value" style="color: #ef4444">0</div>
      </div>
      <div class="summary-card card-warning">
        <div class="summary-label">Warnings</div>
        <div class="summary-value" style="color: #f59e0b">0</div>
      </div>
      <div class="summary-card card-passed">
        <div class="summary-label">Pass Rate</div>
        <div class="summary-value" style="color: #10b981">100%</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" data-filter="all">All Viewports (1)</button>
        <button class="filter-tab" data-filter="failed">Defects Only (0)</button>
        <button class="filter-tab" data-filter="passed">Clean Only (1)</button>
      </div>
    </div>

    <!-- Matrix Grid -->
    <div class="matrix-grid" id="matrixGrid"></div>
  </div>

  <!-- Inspector Modal -->
  <div class="modal-backdrop" id="inspectorModal">
    <div class="modal-container">
      <div class="modal-header">
        <div>
          <h2 id="modalTitle" style="font-size: 18px; font-weight: 700;">Viewport Inspector</h2>
          <span id="modalSubtitle" style="font-size: 12px; color: var(--text-muted); font-family: monospace;"></span>
        </div>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="viewer-pane">
          <img id="viewerImg" class="viewer-image" src="" alt="Annotated Viewport" />
        </div>
        <div class="sidebar-pane" id="findingsSidebar"></div>
      </div>
    </div>
  </div>

  <script id="report-data" type="application/json">{"id":"scan-1792865366728","timestamp":"2026-10-24T18:09:26.728Z","target":"/home/mevlec/Data/devinv2/fixtures/clean","summary":{"totalViewports":1,"totalFindings":0,"criticalFindings":0,"warningFindings":0,"infoFindings":0,"passedViewports":1,"failedViewports":0,"defectBreakdown":{},"durationMs":1694},"matrix":[{"renderId":"desktop-test_1280x720@1x_landscape","name":"desktop-test","viewport":{"name":"desktop-test","width":1280,"height":720,"deviceScaleFactor":1,"isMobile":false,"hasTouch":false,"orientation":"landscape","renderId":"desktop-test_1280x720@1x_landscape"},"status":"pass","findingsCount":{"critical":0,"warning":0,"info":0,"total":0},"screenshotRelPath":"renders/desktop-test_1280x720@1x_landscape/screenshot.png","annotatedRelPath":"renders/desktop-test_1280x720@1x_landscape/annotated.png","findings":[],"consoleErrors":[],"failedRequests":[]}],"config":{"target":"/home/mevlec/Data/devinv2/fixtures/clean","viewports":[{"name":"desktop-test","width":1280,"height":720,"deviceScaleFactor":1,"isMobile":false,"hasTouch":false,"orientation":"landscape"}],"browser":"chromium","fullPage":true,"waitUntil":"networkidle","extraWaitMs":1000,"concurrency":4,"devServer":{"readyTimeoutMs":30000},"vision":{"enabled":true,"model":"gpt-4o","maxImageDim":1568},"output":{"dir":"./pixelsentinel-output/test-clean","clean":true,"html":true,"json":true,"annotatedImages":true}}}</script>
  <script>
    const report = JSON.parse(document.getElementById("report-data").textContent);
    let currentFilter = "all";

    function renderMatrix() {
      const grid = document.getElementById("matrixGrid");
      grid.innerHTML = "";

      const filtered = report.matrix.filter(item => {
        if (currentFilter === "failed") return item.status === "fail";
        if (currentFilter === "passed") return item.status === "pass";
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 48px; color: #94a3b8;">No viewports match current filter.</div>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "render-card";
        card.onclick = () => openInspector(item);

        const badgeClass = item.status === "pass" ? "badge-pass" : "badge-fail";
        const badgeText = item.status === "pass" ? "✓ Pass" : "✕ " + item.findings.length + " Defects";

        card.innerHTML = `
          <div class="render-thumb-wrapper">
            <img class="render-thumb" src="${item.annotatedRelPath}" alt="${item.name}" loading="lazy" />
            <div class="thumb-badge ${badgeClass}">${badgeText}</div>
          </div>
          <div class="render-info">
            <div class="render-title">${item.name}</div>
            <div class="render-specs">${item.viewport.width}×${item.viewport.height} @${item.viewport.deviceScaleFactor}x • ${item.viewport.orientation}</div>
            <div class="render-pills">
              ${item.findingsCount.critical > 0 ? '<span class="pill pill-critical">' + item.findingsCount.critical + ' Critical</span>' : ''}
              ${item.findingsCount.warning > 0 ? '<span class="pill pill-warning">' + item.findingsCount.warning + ' Warning</span>' : ''}
              ${item.status === 'pass' ? '<span class="pill pill-pass">All Clean</span>' : ''}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openInspector(item) {
      document.getElementById("modalTitle").textContent = item.name;
      document.getElementById("modalSubtitle").textContent = `${item.viewport.width}x${item.viewport.height} @${item.viewport.deviceScaleFactor}x (${item.viewport.orientation})`;
      document.getElementById("viewerImg").src = item.annotatedRelPath;

      const sidebar = document.getElementById("findingsSidebar");
      sidebar.innerHTML = `<h3 style="font-size: 15px; margin-bottom: 14px; font-weight: 700;">Findings (${item.findings.length})</h3>`;

      if (item.findings.length === 0) {
        sidebar.innerHTML += '<div style="color: #34d399; font-size: 13px; padding: 12px; background: rgba(52, 211, 153, 0.1); border-radius: 8px;">✓ No visual defects detected in this viewport!</div>';
      } else {
        item.findings.forEach((f, idx) => {
          const card = document.createElement("div");
          card.className = "finding-card";
          const severityColor = f.severity === "critical" ? "#ef4444" : f.severity === "warning" ? "#f59e0b" : "#3b82f6";
          
          let elementsHtml = "";
          if (f.elements && f.elements.length > 0) {
            elementsHtml = f.elements.map(el => `
              <div class="selector-box" title="Click to copy selector" onclick="navigator.clipboard.writeText('${el.selector}'); alert('Selector copied to clipboard!');">
                <span>${el.selector}</span>
                <span style="font-size: 10px; color: #64748b;">COPY</span>
              </div>
            `).join("");
          }

          card.innerHTML = `
            <div class="finding-header">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span class="finding-num" style="background: ${severityColor}">${idx + 1}</span>
                <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; color: ${severityColor}">${f.type}</span>
              </div>
              <span style="font-size: 11px; color: #64748b;">${Math.round(f.confidence * 100)}% conf</span>
            </div>
            <p class="finding-desc">${f.description}</p>
            ${f.suggestedFix ? '<div style="font-size: 11px; color: #a5b4fc; margin-bottom: 8px;">💡 ' + f.suggestedFix + '</div>' : ''}
            ${elementsHtml}
          `;
          sidebar.appendChild(card);
        });
      }

      document.getElementById("inspectorModal").classList.add("open");
    }

    document.getElementById("closeModal").onclick = () => {
      document.getElementById("inspectorModal").classList.remove("open");
    };

    document.getElementById("inspectorModal").onclick = (e) => {
      if (e.target.id === "inspectorModal") {
        document.getElementById("inspectorModal").classList.remove("open");
      }
    };

    document.getElementById("filterTabs").addEventListener("click", (e) => {
      if (e.target.classList.contains("filter-tab")) {
        document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("active"));
        e.target.classList.add("active");
        currentFilter = e.target.dataset.filter;
        renderMatrix();
      }
    });

    renderMatrix();
  </script>
</body>
